<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Screen Switcher</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<script>
			// Texts in the system language (French if fr-*, English otherwise). The markup is written
			// before the sdpi components read their attributes.
			const fr = /^fr\b/i.test(navigator.language || "");
			const L = fr
				? {
						scene: "Scène", loading: "Lecture des scènes…", choose: "Choisir une scène",
						icon: "Icône", color: "Couleur", same: "Comme dans Screen Switcher",
						active: "Scène active", dim: "Assombrir les scènes inactives",
						glyphs: ["Écran", "Deux écrans", "Écran + laptop", "Laptop", "Projecteur", "Télé", "Console", "Casque", "Nuit"],
						colors: ["Bleu", "Vert d'eau", "Vert", "Orange", "Rouge", "Rose", "Violet", "Gris"],
					}
				: {
						scene: "Scene", loading: "Loading scenes…", choose: "Choose a scene",
						icon: "Icon", color: "Color", same: "Same as Screen Switcher",
						active: "Active scene", dim: "Dim inactive scenes",
						glyphs: ["Display", "Two displays", "Display + laptop", "Laptop", "Projector", "TV", "Console", "Headphones", "Night"],
						colors: ["Blue", "Teal", "Green", "Orange", "Red", "Pink", "Purple", "Gray"],
					};
			const GLYPHS = ["monitor", "dual", "monitor-laptop", "laptop", "projector", "tv", "gamepad", "headphones", "moon"];
			const COLORS = ["blue", "teal", "green", "amber", "red", "pink", "violet", "slate"];
			const opts = (keys, labels) => keys.map((k, i) => `<option value="${k}">${labels[i]}</option>`).join("");
			document.write(`
				<sdpi-item label="${L.scene}">
					<sdpi-select setting="sceneId" datasource="getScenes" hot-reload loading="${L.loading}" placeholder="${L.choose}"></sdpi-select>
				</sdpi-item>
				<sdpi-item label="${L.icon}">
					<sdpi-select setting="icon" default="auto"><option value="auto">${L.same}</option>${opts(GLYPHS, L.glyphs)}</sdpi-select>
				</sdpi-item>
				<sdpi-item label="${L.color}">
					<sdpi-select setting="color" default="auto"><option value="auto">${L.same}</option>${opts(COLORS, L.colors)}</sdpi-select>
				</sdpi-item>
				<sdpi-item label="${L.active}">
					<sdpi-checkbox setting="highlight" default="true" label="${L.dim}"></sdpi-checkbox>
				</sdpi-item>`);
		</script>
	</body>
</html>
