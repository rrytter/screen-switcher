<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Screen Switcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <header class="brand"><img src="../assets/icon-64.png" alt=""><span>Screen Switcher</span></header>
    <ul id="scene-list" class="scene-list"></ul>
    <button id="btn-new" class="btn ghost full">+ Nouvelle scène</button>
    <footer class="settings">
      <label class="check"><input type="checkbox" id="opt-autostart"> Lancer au démarrage de Windows</label>
      <label class="check"><input type="checkbox" id="opt-notify"> Notification à chaque scène</label>
    </footer>
  </aside>

  <main id="editor" class="editor">
    <div id="empty" class="empty">Sélectionne ou crée une scène.</div>

    <div id="form" class="form hidden">
      <div class="row head">
        <input id="f-name" class="name" placeholder="Nom de la scène" maxlength="40">
        <div class="actions">
          <button id="btn-delete" class="btn danger">Supprimer</button>
          <button id="btn-save" class="btn">Enregistrer</button>
          <button id="btn-apply" class="btn primary">Enregistrer et appliquer</button>
        </div>
      </div>

      <section class="card">
        <h2>Raccourci clavier</h2>
        <div class="row">
          <button id="f-shortcut" class="shortcut" title="Cliquer puis taper la combinaison">—</button>
          <button id="btn-clear-shortcut" class="btn ghost small">Effacer</button>
          <span id="shortcut-status" class="muted"></span>
        </div>
      </section>

      <section class="card">
        <div class="row between">
          <h2>Écrans</h2>
          <button id="btn-refresh" class="btn ghost small">Actualiser la détection</button>
        </div>
        <div id="layout" class="layout"></div>
        <table class="monitors">
          <thead><tr><th>Écran</th><th>Principal</th><th>Source d'entrée (DDC/CI)</th></tr></thead>
          <tbody id="monitor-rows"></tbody>
          <tfoot><tr><td></td><td><label class="radio"><input type="radio" name="primary" value=""> Ne pas changer</label></td><td></td></tr></tfoot>
        </table>
      </section>

      <section class="card">
        <h2>Sortie audio par défaut</h2>
        <select id="f-audio" class="wide"></select>
      </section>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="../src/profiles.js"></script>
  <script src="app.js"></script>
</body>
</html>
